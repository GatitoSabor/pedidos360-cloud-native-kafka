x-kafka-common: &kafka-common
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports: ["2181:2181"]
    volumes: [zookeeper_1_data:/var/lib/zookeeper/data, zookeeper_1_log:/var/lib/zookeeper/log]

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports: ["2182:2181"]
    volumes: [zookeeper_2_data:/var/lib/zookeeper/data, zookeeper_2_log:/var/lib/zookeeper/log]

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    ports: ["2183:2181"]
    volumes: [zookeeper_3_data:/var/lib/zookeeper/data, zookeeper_3_log:/var/lib/zookeeper/log]

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-1
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["9092:9092"]
    volumes: [kafka_1_data:/var/lib/kafka/data]
    environment:
      <<: *kafka-common
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-2
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["9093:9093"]
    environment:
      <<: *kafka-common
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093
    volumes: [kafka_2_data:/var/lib/kafka/data]

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-3
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["9094:9094"]
    environment:
      <<: *kafka-common
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094
    volumes: [kafka_3_data:/var/lib/kafka/data]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["8088:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181

volumes:
  zookeeper_1_data:
  zookeeper_1_log:
  zookeeper_2_data:
  zookeeper_2_log:
  zookeeper_3_data:
  zookeeper_3_log:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
